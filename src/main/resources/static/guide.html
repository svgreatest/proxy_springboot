    // =========================================================================
    const scenarioTls13 = [

          {
            title: "TCP Stream Opened",
            body: "A raw TCP socket connects to httpbin.org on port 443 before TLS cryptographic bytes begin.",
            example: "Network Packet: SYN -> SYN-ACK -> ACK\nPort: 443 (Standard HTTPS)",
            tag: "Layer 4"
          }
        ],
        wire: { type: "TCP Handshake", bytes: "SYN -> SYN-ACK -> ACK (httpbin.org:443)", desc: "TCP stream ready" },

        anchor: { state: "READY", name: "Waiting for TLS", isCand: "false" }

      {
        step: 1, stage: "KEY_EXCHANGE", from: "client", to: "target",

            tag: "1-RTT Key Exchange"
          }
        ],
        wire: { type: "Record 0x16 (Handshake)", bytes: "16 03 03 00 D0 [ClientHello: KeyShare X25519]", desc: "Speculative KeyShare sent" },
        chain: [], authType: { val: "UNKNOWN", kex: "ECDHE (X25519)", ku: "N/A" },
        anchor: { state: "HANDSHAKE", name: "Negotiating", isCand: "false" }
      },
      {
        step: 2, stage: "KEY_EXCHANGE", from: "target", to: "client",
        msg: "3. ServerHello + KeyShare (Shared Secret Derived!)", type: "tls",
        callout: { icon: "🔑", title: "Shared Secret Computed: S = c_priv * S_pub = s_priv * C_pub" },
        cards: [
          {
            title: "Diffie-Hellman Key Agreement Complete",
            body: "Server generates (s_priv, S_pub) and replies with S_pub. Both sides independently calculate: Shared Secret = c_priv * S_pub = s_priv * C_pub! Secret was NEVER sent over the wire.",
            example: "Selected: TLS_AES_256_GCM_SHA384\nServer KeyShare: curve=x25519, public_key=7c4a11f2...\nSharedSecret = ECDH(c_priv, S_pub)\nKeys Derived & Handshake Encrypted Instantly!",
            tag: "PFS Active"
          }
        ],
        wire: { type: "Record Type 22", bytes: "16 03 03 00 76 [ServerHello + Server KeyShare]", desc: "Keys derived instantly" },
        chain: [], authType: { val: "UNKNOWN", kex: "AES-256-GCM Derived", ku: "N/A" },

          }

        wire: { type: "Encrypted Msg 08", bytes: "17 03 03 00 30 [Encrypted: EncryptedExtensions]", desc: "Encrypted parameters" },

        wire: { type: "Encrypted Msg 11", bytes: "17 03 03 0A C0 [Encrypted: Certificate Msg with 2 certs]", desc: "Encrypted certificate chain" },
        chain: [
          { role: "Leaf", subject: "CN=httpbin.org", isCa: false, selfSigned: false },

        authType: { val: "UNKNOWN", kex: "ECDHE", ku: "digitalSignature" },
        anchor: { state: "PARSED", name: "Awaiting Verification", isCand: "false" }
      },
      {
        step: 5, stage: "AUTHENTICATION", from: "target", to: "client",
        msg: "6. CertificateVerify (RSA Signature over Transcript)", type: "cert",
        callout: { icon: "✍️", title: "THIS IS HOW RSA FITS IN: Digital Signature Proof" },
        cards: [
          {
            title: "RSA is the Digital Signature!",
            body: "To prove ownership of httpbin.org, server signs the entire transcript with its private RSA key. Client verifies with the RSA public key from the certificate.",
            example: "Signature = RSA_PSS_Sign(server_rsa_priv_key, transcript_hash)\nClient verifies: RSA_PSS_Verify(cert_rsa_pub_key, Signature)\n--> Proves S_pub genuinely belongs to httpbin.org!",
            tag: "RSA Proof of Identity"
          }
        ],
        wire: { type: "Encrypted Msg 15", bytes: "17 03 03 01 10 [Encrypted: CertificateVerify (RSA-PSS Signature)]", desc: "Identity authenticated" },
        chain: [
          { role: "Leaf", subject: "CN=httpbin.org", isCa: false, selfSigned: false },

        chain: [], authType: { val: "N/A", kex: "TCP", ku: "N/A" }, anchor: { state: "READY", name: "Waiting for TLS", isCand: "false" }

        ],
        wire: { type: "Handshake Msg 12", bytes: "0C [ServerKeyExchange: curve=secp256r1 + RSA Signature]", desc: "Signed key exchange" },
        chain: [

    function gotoStep(idx) {
      if (idx < 0) idx = 0;
      if (idx >= activeSteps.length) idx = activeSteps.length - 1;
      currentStepIndex = idx;
      renderCurrentStep();
    }

    function nextStep() {
      if (currentStepIndex < activeSteps.length - 1) {
        gotoStep(currentStepIndex + 1);
      } else {
        stopPlay();
      }
    }

    function prevStep() {
      if (currentStepIndex > 0) {
        gotoStep(currentStepIndex - 1);
      }
    }

    function togglePlay() {
      if (playInterval) {
        stopPlay();
      } else {
        startPlay();
      }
    }

    function startPlay() {
      const elIcon = document.getElementById('play-icon-float');
      if (elIcon) elIcon.innerText = "⏸";
      const elText = document.getElementById('play-text-float');
      if (elText) elText.innerText = "Pause";
      playInterval = setInterval(() => {
        if (currentStepIndex < activeSteps.length - 1) {
          nextStep();
        } else {
          gotoStep(0);
        }
      }, stepSpeed);
    }

    function stopPlay() {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
      }
      const elIcon = document.getElementById('play-icon-float');
      if (elIcon) elIcon.innerText = "▶";
      const elText = document.getElementById('play-text-float');
      if (elText) elText.innerText = "Auto Play";
    }

    function setSpeed(spd) {
      stepSpeed = spd;
      document.getElementById('spd-1x').className = spd === 2600 ? "px-2 py-0.5 rounded text-xs font-mono bg-sky-950 text-sky-400 border border-sky-700" : "px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-white";
      document.getElementById('spd-2x').className = spd === 1300 ? "px-2 py-0.5 rounded text-xs font-mono bg-sky-950 text-sky-400 border border-sky-700" : "px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-white";
      if (playInterval) {
        stopPlay();
        startPlay();
      }
    }

    // =========================================================================
    // 11. SVG SEQUENCE RENDERER (LARGE, HIGH CONTRAST, CRISP LABELS)
    // =========================================================================
    function renderSvgSequence() {
      const svg = document.getElementById('sequence-svg');
      const step = activeSteps[currentStepIndex];
      const width = 840;
      const startY = 100; // Generous clearance below actor headers (actor boxes end at y=58)
      const stepGap = activeSteps.length > 8 ? 38 : 42;
      const height = Math.max(460, startY + (activeSteps.length * stepGap) + 30);

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      let html = `<defs>
        <!-- Sleek, smooth arrowheads with tip precisely at refX="10" and zero line overlap -->
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#06b6d4"/>
        </marker>
        <marker id="arrow-emerald" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c084fc"/>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f59e0b"/>
        </marker>
      </defs>`;

      // 1. Draw Actor Columns & Lifelines
      activeActors.forEach(a => {
        const isActive = (a.id === step.from || a.id === step.to);
        
        // Lifeline (starts cleanly below the actor box at y=58)
        html += `<line x1="${a.x}" y1="58" x2="${a.x}" y2="${height - 15}" stroke="${isActive ? a.color : '#334155'}" stroke-width="${isActive ? 2.5 : 1.5}" stroke-dasharray="${isActive ? 'none' : '4 4'}" opacity="${isActive ? 1 : 0.35}"/>`;

        // Actor Header Box (Ends at y = 12 + 46 = 58)
        html += `
          <g transform="translate(${a.x - 60}, 12)">
            <rect width="120" height="46" rx="8" fill="${isActive ? '#1e293b' : '#0f172a'}" stroke="${isActive ? a.color : '#334155'}" stroke-width="${isActive ? 2.5 : 1}"/>
            <text x="60" y="23" fill="${isActive ? '#ffffff' : '#94a3b8'}" font-size="13" font-weight="bold" text-anchor="middle">${a.name}</text>
            <text x="60" y="38" fill="${isActive ? a.color : '#64748b'}" font-size="11" font-family="monospace" text-anchor="middle">${a.sub}</text>
          </g>
        `;
      });

      // 2. Draw Sequence Arrows & Labels
      activeSteps.forEach((s, idx) => {
        const y = startY + (idx * stepGap);
        const fromActor = activeActors.find(a => a.id === s.from);
        const toActor = activeActors.find(a => a.id === s.to);
        const isCurrent = (idx === currentStepIndex);
        const isPast = (idx < currentStepIndex);

        let strokeColor = "#334155";
        let strokeWidth = 1.5;
        let opacity = 0.35;
        let marker = "arrow-blue";

        if (isCurrent) {
          strokeColor = (s.type === 'cert') ? "#34d399" : (s.type === 'tls' ? "#c084fc" : (s.type === 'tunnel' ? "#fbbf24" : "#38bdf8"));
          strokeWidth = 2.5;
          opacity = 1.0;
          marker = (s.type === 'cert') ? "arrow-emerald" : (s.type === 'tls' ? "arrow-purple" : (s.type === 'tunnel' ? "arrow-amber" : "arrow-blue"));
        } else if (isPast) {
          strokeColor = "#64748b";
          strokeWidth = 1.5;
          opacity = 0.65;
          marker = "arrow-blue";
        }

        if (fromActor.x !== toActor.x) {
          const isRight = toActor.x > fromActor.x;
          // Stop line cleanly at the target lifeline so arrow tip lands precisely on target
          const endX = isRight ? toActor.x - 2 : toActor.x + 2;
          const midX = (fromActor.x + toActor.x) / 2;
          const textWidth = Math.min(s.msg.length * 7.5 + 20, 420);
          // Clamped pill coordinates: mathematically guaranteed never to overflow canvas edges!
          const pillX = Math.max(15, Math.min(width - textWidth - 15, midX - textWidth / 2));
          const textCenterX = pillX + textWidth / 2;

          html += `
            <g>
              <line x1="${fromActor.x}" y1="${y}" x2="${endX}" y2="${y}" 
                    stroke="${strokeColor}" stroke-width="${strokeWidth}" 
                    stroke-linecap="butt"
                    marker-end="url(#${marker})" opacity="${opacity}"/>
              <!-- Backdrop pill clamped within SVG boundaries -->
              <rect x="${pillX}" y="${y - 20}" width="${textWidth}" height="18" rx="4"
                    fill="#090d16" fill-opacity="0.92" stroke="${isCurrent ? strokeColor : '#1e293b'}" stroke-width="${isCurrent ? 1 : 0.5}"/>
              <text x="${textCenterX}" y="${y - 7}" 
                    fill="${isCurrent ? '#ffffff' : (isPast ? '#cbd5e1' : '#64748b')}" 
                    font-size="${isCurrent ? 12 : 11}" font-weight="${isCurrent ? '700' : '500'}" 
                    font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="middle">${s.msg}</text>
            </g>
          `;
        } else {
          // Self-call loopback (smooth cubic bezier curve)
          const textWidth = Math.min(s.msg.length * 7.2 + 16, 280);
          // If actor is near right edge, curve loop to left; otherwise to right
          const goLeft = fromActor.x > width * 0.6;
          const loopDir = goLeft ? -1 : 1;
          const arcControlX = fromActor.x + (loopDir * 40);
          const rectX = goLeft ? Math.max(15, fromActor.x - 45 - textWidth) : Math.min(width - textWidth - 15, fromActor.x + 45);

          html += `
            <g>
              <path d="M ${fromActor.x} ${y - 6} C ${arcControlX} ${y - 18}, ${arcControlX} ${y + 18}, ${fromActor.x + (loopDir * 4)} ${y + 6}" 
                    fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" 
                    stroke-linecap="butt"
                    marker-end="url(#${marker})" opacity="${opacity}"/>
              <rect x="${rectX}" y="${y - 9}" width="${textWidth}" height="18" rx="4"
                    fill="#090d16" fill-opacity="0.92" stroke="${isCurrent ? strokeColor : '#1e293b'}" stroke-width="${isCurrent ? 1 : 0.5}"/>
              <text x="${rectX + textWidth / 2}" y="${y + 4}" fill="${isCurrent ? '#ffffff' : '#94a3b8'}" 
                    font-size="${isCurrent ? 11.5 : 10.5}" font-weight="${isCurrent ? 'bold' : 'normal'}" 
                    font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="middle">${s.msg}</text>
            </g>
          `;
        }
      });

      svg.innerHTML = html;
    }

    // MAIN RENDER LOOP
    function renderCurrentStep() {
      const step = activeSteps[currentStepIndex];

      // Counters & Badges
      const stepText = `Step ${currentStepIndex + 1} of ${activeSteps.length}`;
      const elFloat = document.getElementById('float-step-counter');
      if (elFloat) elFloat.innerText = stepText;

      // Callout Box
      document.getElementById('callout-icon').innerText = step.callout.icon;
      document.getElementById('callout-title').innerText = step.callout.title;
      document.getElementById('callout-stage').innerText = step.stage;

      // Render Cards on Right Side with Examples
      const cardsBox = document.getElementById('explainer-cards-container');
      cardsBox.innerHTML = "";
      step.cards.forEach(c => {
        let exampleHtml = "";
        if (c.example) {
          exampleHtml = `
            <div class="mt-2 p-2 bg-black/60 rounded-lg border border-slate-800 font-mono text-xs text-amber-300 overflow-x-auto whitespace-pre">${escapeHtml(c.example)}</div>
          `;
        }

        cardsBox.innerHTML += `
          <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5 shadow-md">
            <div class="flex items-center justify-between">
              <h4 class="font-bold text-xs text-sky-300">${c.title}</h4>
              <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-800 text-slate-300 border border-slate-700">${c.tag}</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">${c.body}</p>
            ${exampleHtml}
          </div>
        `;
      });

      // Render SVG
      renderSvgSequence();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // KEYBOARD NAVIGATION
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextStep();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevStep();
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlay();
      } else if (e.key === 'Home') {
        e.preventDefault();
        gotoStep(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        gotoStep(activeSteps.length - 1);
      }
    });

    // INITIALIZE ON LOAD
    switchScreen('direct-tls');
  </script>

  <!-- FLOATING PERSISTENT CONTROLS DOCK (Primary controller) -->
  <aside id="floating-playback-dock" 
         class="fixed bottom-5 right-5 z-50 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 px-4 py-2 rounded-2xl shadow-2xl flex items-center gap-2 transition-all">
    <div class="flex items-center gap-1.5 pr-2 border-r border-slate-800">
      <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
      <span class="text-xs font-mono font-bold text-sky-300" id="float-step-counter">Step 1 of 8</span>
    </div>
    <button onclick="gotoStep(0)" title="First Step (Home)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold border border-slate-700 transition">⏮</button>
    <button onclick="prevStep()" title="Previous Step (Left Arrow)" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold border border-slate-700 transition">◀ Prev</button>
    <button onclick="togglePlay()" id="btn-play-float" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold shadow transition flex items-center gap-1">
      <span id="play-icon-float">▶</span> <span id="play-text-float">Auto Play</span>
    </button>
    <button onclick="nextStep()" title="Next Step (Right Arrow)" class="px-3.5 py-1 bg-sky-500 hover:bg-sky-400 text-slate-950 font-black rounded-lg text-xs shadow-md shadow-sky-500/40 transition flex items-center gap-1">
      <span>Next</span> <span>▶</span>
    </button>
    <button onclick="gotoStep(activeSteps.length - 1)" title="Last Step (End)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-bold border border-slate-700 transition">⏭</button>
    <div class="h-4 w-[1px] bg-slate-700 mx-1"></div>
    <button onclick="setSpeed(2600)" id="spd-1x" class="px-2 py-0.5 rounded text-xs font-mono bg-sky-950 text-sky-400 border border-sky-700">1x</button>
    <button onclick="setSpeed(1300)" id="spd-2x" class="px-2 py-0.5 rounded text-xs font-mono text-slate-400 hover:text-white">2x</button>
  </aside>
</body>
</html>
