# Squid Authenticated Configuration (Port 3128 inside container, mapped to 3129 on host)
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm BCFIPS Proxy Test Gateway
auth_param basic credentialsttl 2 hours

acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl SSL_ports port 8443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports authenticated
http_access allow Safe_ports authenticated
http_access deny all

http_port 3128

cache deny all
forwarded_for off
via off
