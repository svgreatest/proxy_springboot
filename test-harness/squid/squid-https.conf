# Squid HTTPS Forward Proxy Configuration (Port 8443, Direct TLS to Proxy)
https_port 8443 tls-cert=/etc/squid/ssl/proxy-server.crt tls-key=/etc/squid/ssl/proxy-server.key

# Allow all clients in local docker network
acl localnet src all
http_access allow all

# Allow CONNECT method to standard SSL ports
acl SSL_ports port 443
acl SSL_ports port 8443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports
http_access allow Safe_ports

# Disable caching for clean testing
cache deny all
forwarded_for off
via off
